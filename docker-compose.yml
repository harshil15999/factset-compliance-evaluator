version: '3.8'

services:
  # Mode B: Interactive Web Dashboard on port 3000
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: transaction-compliance-evaluator:latest
    container_name: compliance-dashboard
    restart: unless-stopped
    command: ["web"]
    ports:
      - "3000:3000"
    volumes:
      # Mount data volume bidirectionally so rules added in UI persist to host data/
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - APP_LOG_LEVEL=INFO

  # Mode A: CLI Headless Evaluation
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: transaction-compliance-evaluator:latest
    container_name: compliance-evaluator-cli
    command: ["run"]
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
    profiles:
      - cli

