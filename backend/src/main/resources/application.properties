spring.main.banner-mode=off
spring.main.log-startup-info=false
spring.main.web-application-type=none

# Default log level for the data-quality warnings (stderr). Override per environment via a profile
# (application-<profile>.properties), the --app.log.level argument, or the APP_LOG_LEVEL env var.
app.log.level=WARN

# Column separator for the report (tab by default). To use spaces instead, pass them on the command
# line or via env where whitespace is preserved, e.g. --app.output.separator="    ".
app.output.separator=\t

management.endpoints.web.exposure.include=logfile,health,info
management.endpoint.logfile.enabled=true
management.endpoint.logfile.external-file=logs/app.log
# always processed leniently (malformed ones skipped and logged). Use the `validate` command to check
# either file up front.
